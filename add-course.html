<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Course</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">National<span>Courses</span></div>
    <nav class="navbar">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="my-courses.html">My Courses</a></li>
      <li><a href="add-course.html" class="active">Add Course</a></li>
      <li><a href="contact-us.html">Contact Us</a></li>
    </ul>
    </nav>
  </header>
  <main>
    <section class="add-course-container">
    <h2>Choose Course</h2>
    <form action="my-courses.html">
    <div class="radio-group">
      <input type="radio" id="db" name="courses" value="Data Base" required>
      <label for="db">Data Base</label>
    </div>
    <br><br>
    <div class="radio-group">
      <input type="radio" id="algo" name="courses" value="Algorithms" required>
      <label for="algo">Algorithms</label>
    </div>
    <br><br>
    <div class="radio-group">
      <input type="radio" id="Web" name="courses" value="Web Development" required>
      <label for="web">Web Development</label>
    </div>
    <br><br>
    <div class="radio-group">
      <input type="radio" id="phys" name="courses" value="Physics" required>
      <label for="phys">Physics</label>
    </div>
    <br><br>
    <div class="radio-group">
      <input type="radio" id="calc" name="courses" value="Calculus" required>
      <label for="calc">Calculus</label>
    </div>
    <br><br>
      <button type="submit" class="submit-btn">submit</button>
    </form>
    </section>
  </main>
